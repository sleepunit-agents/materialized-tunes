<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Materialized Tunes</title>
<style>
  /* Bundled faces (OFL) — a desktop app does not change typeface when the
     wifi drops. Variable latin subsets, ~34 KB each. */
  @font-face { font-family: 'Archivo'; font-style: normal; font-weight: 400 700; font-display: swap; src: url(fonts/archivo-latin.woff2) format('woff2'); }
  @font-face { font-family: 'JetBrains Mono'; font-style: normal; font-weight: 400 600; font-display: swap; src: url(fonts/jetbrains-mono-latin.woff2) format('woff2'); }
  :root {
    --bg: #111315; --bg-deep: #0d0f11; --bg-panel: #131619; --bg-card: #191d20;
    --bg-raise: #1b1f23; --bg-sel: #1e2328; --bord: #1e2226; --bord-card: #23272b;
    --bord-raise: #2a2f34; --bord-hover: #3a4046;
    --fg: #e8eaed; --fg-dim: #9aa3ab; --fg-faint: #5c666f; --fg-ghost: #444c53; --fg-log: #7d868e; --fg-num: #c8ccd0;
    --amber: #f0a03c; --amber-deep: #d8862a; --teal: #3dc4cf; --green: #57c48a; --warn: #e0b64f; --err: #e5604f;
    --sans: Archivo, system-ui, sans-serif; --mono: 'JetBrains Mono', monospace;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: #0c0e10; font-family: var(--sans); }
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-thumb { background: var(--bord-raise); border-radius: 5px; }
  ::-webkit-scrollbar-track { background: transparent; }
  /* ---- the shell (redesign P1, docs/redesign-2026-09-03): a fixed grid —
     title bar across the top, icon rail + contextual column on the left,
     the mode's content in the middle, status bar across the bottom. The
     column collapses to nothing (⌘\); the rail never hides. ---- */
  #app { display: grid; grid-template-columns: 52px 216px minmax(0, 1fr); grid-template-rows: 40px minmax(0, 1fr) 28px; height: 100vh; min-width: 1100px; background: var(--bg); color: var(--fg); overflow: hidden; }
  #app.col-off { grid-template-columns: 52px 0 minmax(0, 1fr); }
  @media (max-width: 1180px) { #app { grid-template-columns: 52px 196px minmax(0, 1fr); } }

  .titlebar { grid-column: 1 / -1; display: flex; align-items: center; gap: 12px; height: 40px; padding: 0 0 0 14px; background: var(--bg-deep); border-bottom: 1px solid var(--bord); user-select: none; --wails-draggable: drag; }
  /* macOS keeps its traffic lights (hidden-inset title bar): clear them. */
  body.in-wails-mac .titlebar { padding-left: 84px; }
  .titlebar .logo { width: 16px; height: 16px; border-radius: 4px; background: linear-gradient(160deg, var(--amber), var(--amber-deep)); flex: none; }
  .titlebar .brand { font: 700 12px var(--sans); letter-spacing: .04em; color: var(--fg); white-space: nowrap; }
  .titlebar .gsearch { --wails-draggable: no-drag; display: flex; align-items: center; gap: 7px; width: 300px; height: 26px; margin: 0 auto; padding: 0 10px; background: var(--bg-raise); border: 1px solid var(--bord-raise); border-radius: 6px; }
  .titlebar .gsearch:focus-within { border-color: var(--teal); }
  .titlebar .gsearch input { flex: 1; min-width: 0; background: none; border: 0; outline: none; color: var(--fg); font: 400 12px var(--sans); }
  .titlebar .gsearch input::placeholder { color: var(--fg-faint); }
  .titlebar .gsearch .kbd { font: 400 10px var(--mono); color: var(--fg-ghost); }
  .titlebar .glyph { font: 400 12px var(--sans); color: var(--fg-faint); }
  .titlebar .winctl { --wails-draggable: no-drag; display: flex; align-self: stretch; }
  .titlebar .winctl span { width: 40px; display: flex; align-items: center; justify-content: center; font: 400 12px var(--sans); color: var(--fg-dim); cursor: default; }
  .titlebar .winctl span:hover { background: var(--bg-sel); color: var(--fg); }
  .titlebar .winctl span.close:hover { background: #c42b1c; color: #fff; }
  .titlebar .spacer { flex: 1; }

  .rail { grid-row: 2; grid-column: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 8px 0; background: var(--bg-deep); border-right: 1px solid var(--bord); user-select: none; }
  .rail .rb { position: relative; width: 40px; height: 40px; border-radius: 8px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; cursor: pointer; color: var(--fg-dim); }
  .rail .rb:hover { background: var(--bg-raise); color: var(--fg); }
  .rail .rb.on { background: var(--bg-sel); color: var(--fg); }
  .rail .rb .ic { font: 400 15px var(--sans); line-height: 1; }
  .rail .rb .lb { font: 600 8px var(--sans); letter-spacing: .08em; }
  .rail .rb .dot { position: absolute; top: 5px; right: 6px; width: 6px; height: 6px; border-radius: 50%; background: var(--amber); }
  .rail .rb .cnt { position: absolute; top: 3px; right: 3px; font: 700 8px var(--mono); color: #1a1205; background: var(--amber); border-radius: 6px; padding: 1px 4px; line-height: 1.2; }
  .rail .rb .cnt.ok { background: var(--green); }
  .rail .gap { flex: 1; }
  .rail .lens { width: 40px; border-radius: 8px; border: 1px solid var(--bord-raise); padding: 5px 0; display: flex; flex-direction: column; align-items: center; gap: 2px; cursor: pointer; color: var(--fg-faint); }
  .rail .lens:hover { border-color: var(--bord-hover); }
  .rail .lens.on { border-color: rgba(61,196,207,.5); background: rgba(13,138,148,.14); color: var(--teal); }
  .rail .lens .lb { font: 600 8px var(--sans); letter-spacing: .08em; }
  .rail .lens .dv { font: 600 9px var(--mono); max-width: 40px; overflow: hidden; white-space: nowrap; }
  .rail .lensbox { position: relative; }
  .rail .lensbox .lens-menu { left: 46px; right: auto; top: auto; bottom: 0; }

  .col { grid-row: 2; grid-column: 2; display: flex; flex-direction: column; min-height: 0; overflow: hidden; background: var(--bg-deep); border-right: 1px solid var(--bord); }
  #app.col-off .col { display: none; }
  .col .ch { display: flex; align-items: center; gap: 8px; height: 40px; padding: 0 12px 0 14px; border-bottom: 1px solid var(--bord); flex: none; }
  .col .ch .t { font: 600 13px var(--sans); color: var(--fg); flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .col .ch .a { font: 500 11px var(--sans); color: var(--fg-faint); cursor: pointer; user-select: none; }
  .col .ch .a:hover { color: var(--fg); }
  .col .cb { flex: 1; min-height: 0; overflow: auto; padding: 8px 8px 16px; }
  .col .sec { font: 600 10px var(--sans); letter-spacing: .1em; text-transform: uppercase; color: var(--fg-faint); padding: 12px 6px 4px; display: flex; align-items: center; gap: 6px; }
  .col .sec .a { margin-left: auto; font: 500 10px var(--sans); letter-spacing: 0; text-transform: none; color: var(--fg-faint); cursor: pointer; }
  .col .sec .a:hover { color: var(--fg); }
  .col .fr { display: flex; align-items: center; gap: 8px; padding: 5px 6px; border-radius: 5px; cursor: pointer; user-select: none; font: 400 12px var(--sans); color: var(--fg-dim); }
  .col .fr:hover { background: var(--bg-raise); color: var(--fg); }
  .col .fr.on { background: var(--bg-sel); color: var(--fg); }
  .col .fr.on .nm { color: var(--teal); }
  .col .fr.amber .nm { color: var(--amber); }
  .col .fr .nm { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .col .fr .n { font: 400 10.5px var(--mono); color: var(--fg-faint); }
  .col .fr .st { width: 7px; height: 7px; border-radius: 50%; background: var(--bord-hover); flex: none; }
  .col .fr .st.green { background: var(--green); } .col .fr .st.amber { background: var(--amber); }
  .col .fr .sub { font: 400 10px var(--mono); color: var(--fg-faint); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .col .fr.two { flex-direction: column; align-items: stretch; gap: 2px; }
  .col .fr.two .row1 { display: flex; align-items: center; gap: 8px; }
  .col .fr.two .row1 .nm { font-weight: 600; font-size: 12.5px; }
  .col .fr.tree { padding-left: calc(6px + var(--lvl, 0) * 14px); font: 400 11.5px var(--mono); }
  .col .box { margin: 6px 4px 0; padding: 9px 10px; background: var(--bg-panel); border: 1px solid var(--bord-card); border-radius: 6px; display: flex; flex-direction: column; gap: 4px; }
  .col .box .bt { font: 600 10px var(--sans); letter-spacing: .1em; text-transform: uppercase; color: var(--fg-faint); }
  .col .box .bv { font: 400 11px var(--mono); color: var(--fg-num); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .col .box .bd { font: 400 10.5px var(--sans); color: var(--fg-faint); line-height: 1.45; }
  .col .box.lens { border-color: rgba(61,196,207,.35); background: rgba(13,138,148,.08); cursor: pointer; }
  .col .box.lens .bv { color: var(--teal); font-weight: 600; }
  .col .box .a { font: 500 10.5px var(--sans); color: var(--teal); cursor: pointer; }
  .col .box .a:hover { text-decoration: underline; }
  .col .ci { display: flex; gap: 6px; padding: 4px 6px; }
  .col .ci input { width: 100%; min-width: 0; font: 400 11.5px var(--mono); color: var(--fg); background: var(--bg-panel); border: 1px solid var(--bord-raise); border-radius: 5px; padding: 5px 8px; outline: none; }
  .col .ci input:focus { border-color: var(--teal); }
  .col .ci input::placeholder { color: var(--fg-faint); }
  .col .note { font: 400 10.5px/1.5 var(--sans); color: var(--fg-faint); padding: 10px 8px; margin-top: auto; border-top: 1px solid var(--bord); }
  .col .foot { flex: none; border-top: 1px solid var(--bord); padding: 8px; }

  .main { grid-row: 2; grid-column: 3; min-width: 0; overflow: auto; min-height: 0; display: flex; flex-direction: column; }
  .main > * { flex: none; }
  .main > .fill { flex: 1; }

  .chead { display: flex; align-items: center; gap: 12px; padding: 14px 20px 12px; border-bottom: 1px solid var(--bord); flex: none; flex-wrap: wrap; }
  .chead h1 { font: 600 20px var(--sans); color: var(--fg); margin: 0; white-space: nowrap; }
  .chead .sum { font: 500 12px var(--mono); color: var(--fg-faint); white-space: nowrap; }
  .chead .lsum { font: 500 12px var(--mono); color: var(--teal); white-space: nowrap; }
  .chead .spacer { flex: 1; }
  .chead .sub { font: 400 12px var(--sans); color: var(--fg-dim); flex-basis: 100%; }
  .fpill { display: flex; align-items: center; gap: 6px; font: 600 11px var(--sans); color: var(--fg-dim); border: 1px solid var(--bord-raise); border-radius: 6px; padding: 4px 9px; cursor: pointer; user-select: none; }
  .fpill:hover { color: var(--fg); border-color: var(--bord-hover); }
  .fpill .b { font: 700 9px var(--mono); color: #1a1205; background: var(--amber); border-radius: 6px; padding: 1px 5px; }
  .fchip { display: flex; align-items: center; gap: 5px; font: 500 11px var(--sans); color: var(--teal); border: 1px solid rgba(61,196,207,.35); border-radius: 4px; padding: 3px 8px; cursor: pointer; user-select: none; }
  .fchip .x { color: var(--fg-faint); } .fchip:hover .x { color: var(--fg); }
  .btn { font: 600 11.5px var(--sans); color: var(--fg-dim); background: var(--bg-raise); border: 1px solid var(--bord-raise); border-radius: 6px; padding: 6px 12px; cursor: pointer; user-select: none; white-space: nowrap; }
  .btn:hover { color: var(--fg); border-color: var(--bord-hover); }
  .btn.primary { color: #1a1205; background: var(--amber); border-color: var(--amber-deep); }
  .btn.primary:hover { background: #f5ad52; color: #1a1205; }
  .btn.off { opacity: .45; cursor: default; }
  .devchip { font: 500 11px var(--sans); color: var(--teal); border: 1px solid rgba(61,196,207,.35); border-radius: 4px; padding: 3px 9px; white-space: nowrap; }
  .stochip { font: 500 11px var(--mono); color: var(--fg-dim); border: 1px solid var(--bord-raise); border-radius: 4px; padding: 3px 9px; white-space: nowrap; }

  /* list view: one row per pack, the lens columns teal-headed */
  .lcols, .lrow { display: grid; grid-template-columns: 44px minmax(0, 1fr) 150px 100px 100px 120px 100px 40px; gap: 12px; align-items: center; padding: 7px 20px; }
  .lcols.nolens, .lrow.nolens { grid-template-columns: 44px minmax(0, 1fr) 150px 100px 100px 40px; }
  @media (max-width: 1180px) {
    .lcols, .lrow { grid-template-columns: 44px minmax(0, 1fr) 150px 120px 100px 40px; }
    .lcols.nolens, .lrow.nolens { grid-template-columns: 44px minmax(0, 1fr) 150px 100px 100px 40px; }
    .lcols:not(.nolens) .hide-narrow, .lrow:not(.nolens) .hide-narrow { display: none; }
  }
  .lcols { font: 600 10px var(--sans); letter-spacing: .09em; text-transform: uppercase; color: var(--fg-faint); border-bottom: 1px solid var(--bord-card); padding-top: 9px; padding-bottom: 6px; position: sticky; top: 0; background: var(--bg); z-index: 1; }
  .lcols .lens { color: var(--teal); }
  .lrow { border-bottom: 1px solid #16191c; cursor: pointer; }
  .lrow:hover { background: var(--bg-card); }
  .lrow .art { width: 36px; height: 36px; border-radius: 5px; font-size: 13px; }
  .lrow .nm { display: flex; align-items: center; gap: 8px; min-width: 0; }
  .lrow .nm .t { font: 600 13px var(--sans); color: var(--fg); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .lrow .vd { font: 400 12px var(--sans); color: var(--fg-dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .lrow .num { font: 400 11.5px var(--mono); color: var(--fg-faint); white-space: nowrap; }
  .lrow .num.lens { color: var(--fg-num); }
  .lrow .go { font: 400 12px var(--mono); color: var(--fg-ghost); text-align: right; }
  .lrow:hover .go { color: var(--fg-dim); }
  .grid { grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); padding: 14px 20px 20px; }
  .pack { border-radius: 8px; padding: 12px; }

  .main > .recipe-grid, .main > .cards-grid { flex: 1; min-height: 0; }
  .main > .pl-wrap { flex: 1; min-height: 0; height: auto; }
  .sec-h { display: flex; align-items: center; gap: 12px; padding: 22px 0 4px; scroll-margin-top: 8px; }
  .sec-h h2 { font: 600 20px var(--sans); color: var(--fg); margin: 0; }
  .sec-h .sum { font: 500 12px var(--mono); color: var(--fg-faint); }
  .sec-h .spacer { flex: 1; }
  .sec-h.small { font: 600 10px var(--sans); letter-spacing: .1em; text-transform: uppercase; color: var(--fg-faint); padding: 14px 0 2px; }
  .sec-p { font: 400 12px/1.5 var(--sans); color: var(--fg-dim); max-width: 640px; margin-bottom: 6px; }
  .lcols.disc, .lrow.disc { grid-template-columns: 44px minmax(0, 1fr) 150px 70px 130px 150px 100px; }
  @media (max-width: 1180px) { .lcols.disc, .lrow.disc { grid-template-columns: 44px minmax(0, 1fr) 150px 70px 130px 100px; } }
  .lrow.disc { cursor: default; }
  .lrow.ghost { opacity: .5; }

  .statusbar { grid-column: 1 / -1; grid-row: 3; display: flex; align-items: center; gap: 16px; height: 28px; padding: 0 14px; background: var(--bg-deep); border-top: 1px solid var(--bord); font: 400 11px var(--mono); color: var(--fg-ghost); }
  .statusbar .spacer { flex: 1; }
  .statusbar .upd { color: var(--amber); cursor: pointer; }
  /* cross-pack sample filters + rows */
  .filters { display: flex; align-items: center; gap: 8px; padding: 9px 18px; border-bottom: 1px solid var(--bord); flex: none; flex-wrap: wrap; }
  .flabel { font: 600 10px var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--fg-faint); }
  .filt { font: 400 11.5px var(--sans); color: var(--fg); background: var(--bg-raise); border: 1px solid var(--bord-raise); border-radius: 5px; padding: 5px 8px; outline: none; }
  .filt:focus { border-color: var(--teal); }
  .slist { padding: 4px 10px 20px; }   /* .main is the scroll container */
  .srow { display: grid; grid-template-columns: minmax(180px, 2.2fr) minmax(140px, 1.6fr) 90px 70px 80px 90px 60px; gap: 10px; align-items: center; padding: 7px 8px; border-radius: 5px; cursor: pointer; }
  .srow:hover { background: var(--bg-raise); }
  .sname { font: 400 12px var(--sans); color: var(--fg); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .spack { font: 400 11px var(--mono); color: var(--fg-faint); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .smeta { font: 400 11px var(--mono); color: var(--fg-dim); overflow: hidden; white-space: nowrap; }
  .smeta b { color: var(--teal); font-weight: 600; }
  .titlebar .brand { font: 700 12px var(--sans); letter-spacing: .06em; color: var(--fg); }
  .titlebar .meta { font: 400 11px var(--mono); color: var(--fg-faint); margin-left: 12px; }


  .screen-head { display: flex; align-items: center; gap: 12px; padding: 14px 20px 12px; border-bottom: 1px solid var(--bord); }
  .screen-head h1 { font: 600 20px var(--sans); color: var(--fg); margin: 0; }
  .screen-head .sum { font: 500 12px var(--mono); color: var(--fg-faint); }
  .search { display: flex; align-items: center; gap: 6px; background: var(--bg-raise); border: 1px solid var(--bord-raise); border-radius: 5px; padding: 5px 10px; width: 220px; }
  .search input { background: none; border: none; outline: none; color: var(--fg); font: 400 11px var(--sans); flex: 1; min-width: 0; }
  .search input::placeholder { color: var(--fg-faint); }
  .search .kbd { font: 400 10px var(--mono); color: var(--fg-ghost); }

  .lens-btn { display: flex; align-items: center; gap: 8px; background: var(--bg-raise); border: 1px solid var(--bord-raise); border-radius: 6px; padding: 5px 11px; cursor: pointer; user-select: none; }
  .lens-btn:hover { border-color: var(--bord-hover); }
  .lens-btn.on { background: rgba(13,138,148,.14); border-color: rgba(61,196,207,.4); }
  .lens-btn .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--fg-ghost); flex: none; }
  .lens-btn.on .dot { background: var(--teal); }
  .lens-btn .label { font: 600 11px var(--sans); color: var(--fg-dim); white-space: nowrap; }
  .lens-btn.on .label { color: var(--teal); }
  .lens-btn .caret { font: 400 9px var(--sans); color: var(--fg-faint); }
  .menu-veil { position: fixed; inset: 0; z-index: 5; }
  .lens-menu { position: absolute; right: 0; top: calc(100% + 6px); width: 300px; background: #16191c; border: 1px solid #2f353b; border-radius: 7px; box-shadow: 0 10px 32px rgba(0,0,0,.55); z-index: 6; padding: 6px; display: flex; flex-direction: column; }
  .lens-menu .sect { font: 600 9px var(--sans); color: var(--fg-faint); letter-spacing: .1em; padding: 8px 9px 4px; }
  .lens-menu .row { display: flex; align-items: center; gap: 8px; padding: 7px 9px; border-radius: 5px; cursor: pointer; }
  .lens-menu .row:hover { background: var(--bg-sel); }
  .lens-menu .row.picked { background: rgba(13,138,148,.14); }
  .lens-menu .row .dname { font: 600 11.5px var(--sans); color: var(--fg); }
  .lens-menu .row.picked .dname { color: var(--teal); }
  .lens-menu .row .dsub { font: 400 9.5px var(--mono); color: var(--fg-faint); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .lens-menu .row .star { font: 400 13px var(--sans); cursor: pointer; padding: 0 2px; color: var(--fg-ghost); }
  .lens-menu .row .star.owned { color: var(--amber); }
  .lens-menu .row .star:hover { color: var(--amber); }
  .lens-menu .foot { display: flex; align-items: center; gap: 8px; padding: 8px 9px 5px; border-top: 1px solid var(--bord); margin-top: 5px; cursor: pointer; user-select: none; }

  .ck { width: 13px; height: 13px; border-radius: 3px; border: 1px solid var(--bord-hover); background: transparent; display: flex; align-items: center; justify-content: center; font: 700 9px var(--mono); color: #0b1516; flex: none; }
  .ck.on { background: var(--amber); border-color: var(--amber); }

  .filterbar { display: flex; gap: 8px; align-items: center; padding: 9px 18px; border-bottom: 1px solid var(--bord); }
  .chip { font: 500 11px var(--sans); color: var(--fg-dim); background: var(--bg-raise); border: 1px solid var(--bord-raise); border-radius: 4px; padding: 3px 9px; cursor: pointer; user-select: none; }
  .chip:hover { border-color: var(--bord-hover); }
  .chip.active { color: var(--teal); border-color: rgba(61,196,207,.4); }
  .lens-note { font: 400 11px var(--mono); color: var(--fg-faint); }

  .seg { display: flex; border: 1px solid var(--bord-raise); border-radius: 5px; overflow: hidden; user-select: none; }
  .seg span { font: 600 11px var(--sans); color: var(--fg-dim); padding: 4px 12px; cursor: pointer; }
  .seg span:hover { color: var(--fg); }
  .seg span.on { background: var(--bg-sel); color: var(--fg); cursor: default; }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 10px; padding: 14px 18px 18px; }
  /* discover: thin cards on purpose — registry identity only, the ownership
     boundary made visible. Ghost = the recognized-not-sourced tail. */
  .pack.thin { cursor: default; }
  .pack.ghost { opacity: .55; }
  .badge.free { color: var(--green); border-color: rgba(87,196,138,.35); }
  .badge.paid { color: var(--fg-dim); border-color: var(--bord-raise); }
  .badge.lic { color: var(--teal); border-color: rgba(61,196,207,.35); }
  .badge.orphan { color: var(--fg-faint); border-color: var(--bord-raise); font-weight: 500; }
